<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>सामाजिक विकास चेतना समिति | SVCS</title>
<style>body{font-family:Arial,sans-serif;text-align:center;padding:40px;color:#102a72}#status{margin-top:20px;color:#637087}</style>
</head>
<body>
<p>SVCS वेबसाइट लोड हो रही है…</p>
<div id="status">कृपया प्रतीक्षा करें</div>
<script>
(async function(){
  const source='https://raw.githubusercontent.com/amarfbt-hash/svcs-website/7257cb97a18f8b7f7314f877d9a835fbbb19152b/index.html';
  try{
    const response=await fetch(source+'?v=1');
    if(!response.ok) throw new Error('Website source could not be loaded');
    let html=await response.text();
    html=html.replace(/href=["']#idcard["']/gi,'href="donation.html"');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.getElementById('status').textContent='वेबसाइट लोड नहीं हो पाई। कृपया कुछ देर बाद दोबारा प्रयास करें।';
    console.error(error);
  }
})();
</script>
</body>
</html>
